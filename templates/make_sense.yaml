# Шаблон обработки EPG: MAKE SENSE
# Правила — данные, а не код. Новый заказчик = новый YAML-файл рядом.

name: MAKE SENSE
output_name: "EPG {name} {d1}.{m1} - {d2}.{m2}.{y2} (msk time).xlsx"

# Канал определяется по имени исходного файла (порядок важен)
# display — что пишется в столбец «канал»; values — как канал записан в выгрузках (столбец Channel)
channels:
  - match: ["PLAN B", "PLAN_B", "PLANB"]
    code: PLAN_B
    name: "PLAN B"
    display: "PLAN B"
    values: ["PlanB", "Plan B", "PlanB_RUS", "Plan_B_RUS", "PLAN B"]
  - match: ["9-1-1", "911"]
    code: "911"
    name: "9-1-1"
    display: 911
    values: ["Suspenso_RUS", "Suspense_RUS", "Suspenso", "Suspense", "911"]
  - match: ["VESNA"]
    code: VESNA
    name: "VESNA"
    display: "VESNA"
    values: ["Romance_RUS", "Romanse_RUS", "Romance", "Романс", "VESNA"]

# Строка заголовков ищется в первых N строках по этим «якорным» колонкам
header_anchors: ["Формат", "Format", "Film Format", "Название (рус)", "Title Rus", "Название эпизода", "Episode Name", "Channel", "Канал"]
header_search_rows: 15

rules:
  # 0. Шапка и порядок столбцов как в образце «EPG 9-1-1 09.11 - 15.11.2026 msk time.xlsx».
  #    from — как этот столбец может называться во входных файлах.
  - type: layout
    sheet_title: "Лист1"
    columns:
      - {name: "канал",               role: channel, from: ["Channel", "Канал"]}
      - {name: "дата",                from: ["Date", "Дата"]}
      - {name: "время",               from: ["Time", "Время", "Start Time", "Время начала"]}
      - {name: "формат",              from: ["Film Format", "Format", "Формат"]}
      - {name: "название (рус)",      from: ["Title Rus", "Название (рус)", "Название"]}
      - {name: "название (ориг)",     from: ["Title Eng", "Title Orig", "Original Title", "Название (ориг)", "Название (англ)"]}
      - {name: "сезон",               int: true, from: ["Season #", "Season#", "Season", "Сезон"]}
      - {name: "номер серии",         int: true, from: ["Episode #", "Episode#", "Episode", "Номер серии", "Серия"]}
      - {name: "название эпизода",    from: ["Episode Name", "Название эпизода"]}
      - {name: "маркер",              from: ["Age Restrict", "Age Rating", "Возрастное ограничение", "Маркер", "Возраст"]}
      - {name: "год",                 int: true, from: ["Year", "Год"]}
      - {name: "жанр",                from: ["Movie Genre", "Genre", "Жанр"]}
      - {name: "страна",              from: ["Country", "Страна"]}
      - {name: "описание (короткое)", role: desc_short, from: ["Description Short", "Описание (короткое)", "Short Description"]}
      - {name: "описание (полное)",   role: desc_long, from: ["Description Long", "Описание (полное)", "Long Description"]}
      - {name: "Актёры",              role: actors, from: ["Actors", "Актеры", "Cast", "В ролях"]}

  - type: drop_columns_prefix        # удалить столбцы, начинающиеся с Unnamed
    prefix: "unnamed"

  - type: time_floor                 # время вниз до 5 минут, HH:MM
    columns: ["Время", "Время начала", "Start Time", "Time"]
    step_minutes: 5

  - type: date_format                # дата DD/MM/YYYY
    columns: ["Дата", "Date"]
    format: "DD/MM/YYYY"

  - type: replace_exact              # Movie -> х/ф, только точное совпадение
    columns: ["Формат", "Format", "Film Format"]
    mapping:
      Movie: "х/ф"

  - type: catalog_format             # по каталогу канала: фильм -> х/ф, сериал -> сериал
    title: ["Название (рус)", "Title Rus"]
    format: ["Формат", "Format", "Film Format"]
    mapping:
      film: "х/ф"
      series: "сериал"

  - type: clean_episode_name         # «1 серия», «Эпизод 3», «Серия №2» -> пусто; «Эпизод 3. Татьяна» не трогаем
    columns: ["Название эпизода", "Episode Name"]

  - type: fill_descriptions          # пустые описания — из каталогов (свой канал, затем остальные)
    title: ["название (рус)"]
    season: ["сезон"]
    episode: ["номер серии"]
    desc_short: ["описание (короткое)"]
    desc_long: ["описание (полное)"]

  - type: clear_same_original        # «название (ориг)» = «название (рус)» -> ориг пустое
    target: ["название (ориг)"]
    compare_with: ["название (рус)"]

  - type: film_clear_episode         # у фильма нет сезона, серии и названия серии
    format: ["формат"]
    film_value: "х/ф"
    columns: ["сезон", "номер серии", "название эпизода"]

  - type: age_rating                 # 12 -> 12+, 18 years -> 18+
    columns: ["Возрастное ограничение", "Маркер", "Age Restrict", "Age Rating", "Age"]

  - type: clear_if_equal             # очистить эпизод, если совпадает с названием
    target: ["название эпизода", "Episode Name"]
    compare_with: ["название (рус)", "Title Rus"]

  # Оформление итогового файла — всегда последним
  - type: style
    font: Arial
    size: 10
    freeze: "F2"                     # шапка и столбцы до «название (рус)» видны при прокрутке
    day_column: "дата"               # новые сутки — жирная линия и чередование фона
    bold: ["название (рус)"]
    center: ["канал", "дата", "время", "формат", "сезон", "номер серии", "маркер", "год"]
    widths:
      "канал": 12.5
      "дата": 14
      "время": 11.7
      "формат": 10.7
      "название (рус)": 34.7
      "название (ориг)": 24
      "сезон": 8.9
      "номер серии": 11.7
      "название эпизода": 26
      "маркер": 8
      "год": 6
      "жанр": 21.1
      "страна": 14
      "описание (короткое)": 60
      "описание (полное)": 100
      "Актёры": 30

# Каталоги каналов: какие листы файла каталога — фильмы, какие — сериалы.
# type: film | series | keep (формат не трогать) |
#       column — тип указан в столбце type_column («фильм» / «сериал»; другие значения пропускаются) |
#       auto — по числу серий и хронометражу: сериал, если серий больше film_max_episodes,
#              или серий не меньше long_from_episodes и серия длиннее film_max_minutes; иначе фильм
catalogs:
  "911":
    label: "INVENTORY SUSPENSE"
    sheets:
      - {name: "FILMS",  type: film,   title: "Name RU MOVIES"}
      - {name: "SERIES", type: series, title: "Name RU SERIES"}
      - {name: "ODDS",   type: film,   title: "Name RU ODDS", optional: true}
  VESNA:
    label: "VESNA INVENTORY"
    sheets:
      - {name: "CONTENT",     type: film,   title: "Название (RU)",
         desc_short: "Short EPG RU", desc_long: "Long EPG RU"}
      - {name: "РОЖДЕСТВО",   type: film,   title: "Название (RU)", optional: true,
         desc_short: "Short EPG RU", desc_long: "Long EPG RU"}
      - {name: "СЕРИАЛЫ",     type: series, title: "Название (RU)",
         season: "Season", episode: "Episode", desc_short: "Base EPG RU", desc_long: "Description EPG RU"}
      - {name: "СЕРИАЛЫ РУС", type: series, title: "Название (RU)", optional: true,
         season: "Season", episode: "Episode", desc_short: "Short EPG RU", desc_long: "Long EPG RU"}
      - {name: "РУССКОЕ",     type: auto,   title: "Название (RU)", optional: true,
         episode: "Episode", desc_short: "Short EPG RU", desc_long: "Long EPG RU",
         duration: "Duration", film_max_episodes: 4, film_max_minutes: 55, long_from_episodes: 3}
  PLAN_B:
    label: "PLAN B · ФИЛЬМЫ / СЕРИАЛЫ / MAURIS"
    sheets:
      - {name: "ФИЛЬМЫ",    type: column, title: "Название (RU)", type_column: "Тип", optional: true, default: film}
      - {name: "СЕРИАЛЫ",   type: column, title: "Название (RU)", type_column: "Тип", optional: true, default: series}
      - {name: "MAURIS",    type: column, title: "Название (RU)", type_column: "Тип", optional: true, default: film}
      - {name: "НЕ РЕШЕНО", type: column, title: "Название (RU)", type_column: "Тип", optional: true}
      - {name: "КАТАЛОГ",   type: column, title: "Название (RU)", type_column: "Тип", optional: true}
      - {name: "ОПИСАНИЯ",  type: descriptions, title: "Название (RU)", optional: true,
         season: "Сезон", episode: "Серия", desc_short: "Описание (короткое)", desc_long: "Описание (полное)"}
