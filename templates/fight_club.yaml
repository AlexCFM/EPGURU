# Шаблон обработки EPG: FIGHT CLUB

name: FIGHT CLUB
output_name: "EPG_{channel}_{d1}_{m1}_{d2}_{m2}_processed.xlsx"
versioning: true          # при повторной обработке: _v2, _v3...

channels:
  - match: ["FIGHT CLUB", "FIGHT_CLUB", "FIGHT-CLUB", "FIGHTCLUB"]
    code: FIGHT_CLUB

header_anchors: ["Date", "Дата", "Start Time", "Время", "EPG_TITLE_RUS", "Название"]
header_search_rows: 15

rules:
  # 1. Дата берётся из самого файла (там уже правильное число), только формат DD/MM/YYYY.
  #    Пересчёт дат от имени файла (rebuild_dates) отключён; вернуть можно этим правилом:
  #    - type: rebuild_dates
  #      date_columns: ["Date", "Дата"]
  #      time_columns: ["Start Time", "Время"]
  #      previous_day_from: "22:00"
  - type: date_format
    columns: ["Date", "Дата"]
    format: "DD/MM/YYYY"

  # 2. Только подряд идущие дубли; дата и время в сравнении не участвуют,
  #    пустая строка — граница блока
  - type: dedupe_consecutive
    ignore_columns: ["Date", "Дата", "Start Time", "Время"]

  # 3. Замена названия
  - type: replace_exact
    columns: ["EPG_TITLE_RUS", "Название"]
    strip: true
    mapping:
      "МИСС ВСЕЛЕННАЯ": "ЗАГЛУШКА"

  # 4. Каталог (если загружен и в EPG есть столбец формата): фильм -> х/ф, сериал -> сериал
  - type: catalog_format
    title: ["EPG_TITLE_RUS", "Название", "Title Rus"]
    format: ["Format", "Формат", "Film Format", "Тип"]
    mapping:
      film: "х/ф"
      series: "сериал"

  # 5. Возраст: ровно один «+» в конце у каждого непустого значения
  - type: append_suffix
    columns: ["AGE RATING", "Возраст"]
    suffix: "+"

# Каталог FIGHT CLUB: листы ФИЛЬМЫ / СЕРИАЛЫ (или один лист КАТАЛОГ со столбцом «Тип»)
catalogs:
  FIGHT_CLUB:
    label: "FIGHT CLUB · ФИЛЬМЫ / СЕРИАЛЫ"
    sheets:
      - {name: "ФИЛЬМЫ",  type: column, title: ["Название (RU)", "Название", "EPG_TITLE_RUS"], type_column: "Тип", optional: true, default: film}
      - {name: "СЕРИАЛЫ", type: column, title: ["Название (RU)", "Название", "EPG_TITLE_RUS"], type_column: "Тип", optional: true, default: series}
      - {name: "КАТАЛОГ", type: column, title: ["Название (RU)", "Название", "EPG_TITLE_RUS"], type_column: "Тип", optional: true}
